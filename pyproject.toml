[project]
name = "voxserve"
version = "0.1.0"
description = "Zero-GPU OpenAI-compatible voice server. Any voice, any box."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
kokoro = ["kokoro-onnx>=0.2"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
voxserve = "voxserve.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxserve"]
